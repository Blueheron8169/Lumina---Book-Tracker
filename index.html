<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Book Tracker</title>
    <meta name="description" content="A beautiful and modern book tracking application.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header & Search -->
        <header class="app-header glass">
            <div class="logo-container">
                <span class="logo-icon">✧</span>
                <h1 class="logo-text">Lumina</h1>
            </div>
            <form id="search-form" class="search-container">
                <input type="text" id="search-input" placeholder="Search by title or author..." required>
                <button type="submit" id="search-btn" class="btn-primary">Search</button>
            </form>
        </header>

        <main class="main-content">
            <!-- Search Results Section -->
            <section id="search-section" class="content-section">
                <h2 class="section-title">Discover <span id="search-query-display"></span></h2>
                <div id="loading-spinner" class="spinner hidden"></div>
                <div id="search-results" class="books-grid">
                    <!-- Search results will be injected here -->
                </div>
            </section>

            <!-- Library Section -->
            <section id="library-section" class="content-section">
                <h2 class="section-title">My Library</h2>
                
                <div class="library-tabs">
                    <button class="tab-btn active" data-tab="want-to-read">Want to Read</button>
                    <button class="tab-btn" data-tab="read">Read</button>
                </div>

                <div id="library-want-to-read" class="books-grid tab-content active">
                    <!-- Want to read books injected here -->
                </div>
                
                <div id="library-read" class="books-grid tab-content hidden">
                    <!-- Read books injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
</body>
</html>
